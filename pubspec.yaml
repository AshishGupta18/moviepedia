name: moviepedia
description: "Browse Movies."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: ^1.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localization: 
    sdk: flutter
  intl: ^0.19.0  

  cupertino_icons: ^1.0.8

  flutter_bloc: ^9.1.0

  get_it: ^8.0.3
  injectable: ^2.5.0

  go_router: ^15.1.1

  http: ^1.3.0
  dio: ^5.8.0+1
  retrofit: ^4.4.2
  json_annotation: ^4.9.0

  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_secure_storage: ^9.2.4

  logging: ^1.3.0
  equatable: ^2.0.7
  flutter_dotenv: ^5.2.1

  flutter_svg: ^2.1.0

  imdb_localization:
    path: packages/imdb_localization

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.15
  injectable_generator: ^2.7.0
  retrofit_generator: ^9.1.9
  json_serializable: ^6.9.5
  hive_generator: ^2.0.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  thunder_analysis:
    git:
      url: https://github.com/khamidjon/thunder-analysis

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assests/images
    - assests/icons
    

